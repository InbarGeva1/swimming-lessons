<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ענת פרקש | סרטוני הדרכת לימוד שחייה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Heebo', sans-serif;
            background: linear-gradient(135deg, #ffffff 0%, #f4f7fa 100%);
            color: #0f172a;
            scroll-behavior: smooth;
            min-height: 100vh;
        }

        .nav-glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .video-card-modern {
            transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .video-card-modern:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        .category-accent {
            width: 48px;
            height: 4px;
            background: #1d4ed8;
            border-radius: 2px;
            margin-bottom: 1rem;
        }

        video {
            border-radius: 12px;
            background: #000;
        }

        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto 3rem auto;
        }

        .search-input {
            width: 100%;
            padding: 1rem 3rem 1rem 1.5rem;
            border-radius: 99px;
            border: 2px solid #e2e8f0;
            background: white;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .search-input:focus {
            outline: none;
            border-color: #1d4ed8;
            box-shadow: 0 10px 15px -3px rgba(29, 78, 216, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #1d4ed8; }
    </style>
</head>
<body class="antialiased">

    <nav class="nav-glass sticky top-0 z-50 px-8 py-5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="text-2xl font-black tracking-tighter text-blue-900">ענת פרקש</span>
        </div>
    </nav>

    <header class="pt-24 pb-8 px-6 text-center">
        <h1 class="text-5xl md:text-7xl font-black text-slate-900 tracking-tighter leading-tight mb-8">
            סרטוני הדרכת <br>
            <span class="text-blue-700">לימוד שחייה</span>
        </h1>

        <div class="search-container">
            <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </span>
            <input type="text" id="search-input" class="search-input" placeholder="חפשו סרטון, קטגוריה או נושא..." oninput="filterGallery()">
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-8 pb-32">
        <div id="video-gallery" class="space-y-24">
            <!-- Content will be injected by JavaScript -->
        </div>
        <div id="no-results" class="hidden text-center py-20">
            <p class="text-2xl text-slate-400 font-medium">לא נמצאו סרטונים התואמים לחיפוש שלך.</p>
        </div>
    </main>

    <footer class="bg-white/50 border-t border-slate-200 py-16 px-8">
        <div class="max-w-7xl mx-auto flex flex-col items-center text-center">
            <div class="w-10 h-1 bg-blue-700 mb-6 rounded-full"></div>
            <h4 class="text-xl font-bold text-blue-900 mb-2">ענת פרקש</h4>
            <p class="text-slate-400 text-sm font-medium">כל הזכויות שמורות © ענת פרקש</p>
        </div>
    </footer>

    <script>
        const DATA = [
            {
                category: "טכניקת חתירה",
                description: "שיפור היעילות והמהירות במים דרך תרגילים ממוקדים.",
                videos: [
                    {
                        title: "מנח גוף במים",
                        description: "איך לשמור על גוף ישר ומאוזן כדי להפחית התנגדות.",
                        url: "https://inbargeva1.github.io/swimming-lessons/videos/WhatsApp Video 2026-05-06 at 18.14.37.mp4", // וודאי שהקובץ נמצא בתיקיית videos
                        duration: "0:16"
                    },
                    {
                        title: "עבודת רגליים נכונה",
                        description: "טכניקת בעיטה מהאגן ולא מהברך.",
                        url: "https://inbargeva1.github.io/swimming-lessons/videos/WhatsApp Video 2026-05-06 at 21.26.44.mp4",
                        duration: "0:14"
                    }
                ]
            },
            {
                category: "נשימה והסתגלות",
                description: "ביטחון עצמי במים עמוקים ושליטה בנשימה.",
                videos: [
                    {
                        title: "נשימה צידית",
                        description: "לימוד הוצאת האוויר בתוך המים ולקיחת אוויר מהצד.",
                        url: "https://inbargeva1.github.io/swimming-lessons/videos/WhatsApp Video 2026-05-13 at 23.18.57.mp4",
                        duration: "0:28"
                    }
                ]
            }
        ];

        function filterGallery() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            renderGallery(query);
        }

        function renderGallery(filterTerm = "") {
            const gallery = document.getElementById('video-gallery');
            const noResults = document.getElementById('no-results');
            gallery.innerHTML = '';

            let hasResults = false;

            DATA.forEach(section => {
                // בדיקה אם הקטגוריה או התיאור שלה תואמים לחיפוש
                const categoryMatches = section.category.toLowerCase().includes(filterTerm) ||
                                       section.description.toLowerCase().includes(filterTerm);

                // סינון הסרטונים בתוך הקטגוריה
                const filteredVideos = section.videos.filter(v => {
                    return categoryMatches ||
                           v.title.toLowerCase().includes(filterTerm) ||
                           v.description.toLowerCase().includes(filterTerm);
                });

                if (filteredVideos.length > 0) {
                    hasResults = true;
                    const sectionEl = document.createElement('section');
                    sectionEl.innerHTML = `
                        <div>
                            <div class="category-accent"></div>
                            <h2 class="text-3xl font-black text-slate-900 mb-2">${section.category}</h2>
                            <p class="text-slate-500 font-medium text-lg max-w-2xl">${section.description}</p>

                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-10">
                                ${filteredVideos.map(v => `
                                    <div class="video-card-modern group">
                                        <div class="relative aspect-video bg-slate-200 rounded-2xl overflow-hidden mb-5 shadow-sm border border-white">
                                            <video
                                                class="w-full h-full object-cover"
                                                controls
                                                playsinline
                                                webkit-playsinline
                                                preload="metadata">
                                                <source src="${v.url}" type="video/mp4">
                                                הדפדפן שלך לא תומך בנגן הוידאו.
                                            </video>
                                            <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md text-white text-[10px] font-bold px-2 py-1 rounded-md">
                                                ${v.duration}
                                            </div>
                                        </div>
                                        <h3 class="text-xl font-bold text-slate-900 mb-1 group-hover:text-blue-700 transition-colors">${v.title}</h3>
                                        <p class="text-slate-500 text-sm leading-relaxed">${v.description}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    gallery.appendChild(sectionEl);
                }
            });

            // הצגת הודעה אם אין תוצאות
            noResults.classList.toggle('hidden', hasResults);
        }

        window.onload = () => renderGallery();
    </script>
</body>
</html>
