        function filterGallery() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            renderGallery(query);
        }

        // --- כלי צבע: הופך HEX ל"r,g,b" עבור שימוש ב-rgba() בתוך CSS variables ---
        function hexToRgb(hex) {
            const clean = hex.replace('#', '');
            const r = parseInt(clean.substring(0, 2), 16);
            const g = parseInt(clean.substring(2, 4), 16);
            const b = parseInt(clean.substring(4, 6), 16);
            return `${r}, ${g}, ${b}`;
        }

        // מבהיר צבע HEX לכיוון לבן, ליצירת גוון רקע עדין תואם
        function tint(hex, amount) {
            const clean = hex.replace('#', '');
            const r = parseInt(clean.substring(0, 2), 16);
            const g = parseInt(clean.substring(2, 4), 16);
            const b = parseInt(clean.substring(4, 6), 16);
            const nr = Math.round(r + (255 - r) * amount);
            const ng = Math.round(g + (255 - g) * amount);
            const nb = Math.round(b + (255 - b) * amount);
            return `rgb(${nr}, ${ng}, ${nb})`;
        }

        // מכהה צבע HEX לכיוון שחור, ליצירת גרסת טקסט קריאה מתוך גוון פסטל בהיר
        function darken(hex, amount) {
            const clean = hex.replace('#', '');
            const r = parseInt(clean.substring(0, 2), 16);
            const g = parseInt(clean.substring(2, 4), 16);
            const b = parseInt(clean.substring(4, 6), 16);
            const nr = Math.round(r * (1 - amount));
            const ng = Math.round(g * (1 - amount));
            const nb = Math.round(b * (1 - amount));
            return `rgb(${nr}, ${ng}, ${nb})`;
        }

        // בונה מחרוזת style עם משתני CSS של הצבע, לשימוש על מיכל (section/div)
        // --accent הוא הגוון הפסטל המלא (לרקעים/נקודות/פסים), --accent-text גרסה כהה יותר לטקסט קריא
        function accentStyle(hex) {
            return `--accent:${hex}; --accent-rgb:${hexToRgb(hex)}; --accent-text:${darken(hex, 0.42)};`;
        }

        function videoCardHTML(v) {
            return `
                <div class="video-card-modern group" 
                    onclick='openModal(
                    "${v.driveId}",
                    "${v.title.replace(/"/g,"&quot;").replace(/\n/g,"\\n")}",
                    "${v.description.replace(/"/g,"&quot;").replace(/\n/g,"\\n")}"
                    )'>
                    <div class="relative aspect-[9/16] max-h-[320px] mx-auto w-full bg-slate-900 rounded-2xl overflow-hidden mb-4 shadow-sm border border-slate-200 flex items-center justify-center">
                        <div class="absolute inset-0 bg-gradient-to-tr from-slate-900 to-slate-800 flex flex-col items-center justify-center p-4 text-center">
                            <div class="play-overlay w-12 h-12 rounded-full flex items-center justify-center text-white shadow-md mb-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 fill-current ml-1" viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                            </div>
                            <span class="text-[11px] font-bold text-slate-400 tracking-wider">לחצו לצפייה</span>
                        </div>
                    </div>
                    <h3 class="text-lg font-bold text-slate-900 mb-1 group-hover:text-blue-700 transition-colors text-center md:text-right">${v.title}</h3>
                    <p class="text-slate-500 text-xs leading-relaxed category-description text-center md:text-right">${v.description}</p>
                </div>
            `;
        }

        // מחזיר את רשימת הסרטונים התואמים לחיפוש עבור תת-קטגוריה/קטגוריה רגילה
        function getFilteredVideos(node, filterTerm, parentMatches) {
            const nodeMatches = parentMatches ||
                node.category.toLowerCase().includes(filterTerm) ||
                node.description.toLowerCase().includes(filterTerm);

            return node.videos.filter(v =>
                nodeMatches ||
                v.title.toLowerCase().includes(filterTerm) ||
                v.description.toLowerCase().includes(filterTerm)
            );
        }

        function renderGallery(filterTerm = "") {
            const gallery = document.getElementById('video-gallery');
            const noResults = document.getElementById('no-results');
            gallery.innerHTML = '';

            let hasResults = false;

            DATA.forEach((section, idx) => {
                const sectionEl = document.createElement('section');
                sectionEl.id = `cat-${idx}`;
                sectionEl.className = 'scroll-mt-28';

                if (section.isGroup) {
                    // --- קטגוריית-על עם תתי-קטגוריות ---
                    const parentMatches = section.category.toLowerCase().includes(filterTerm);
                    const groupAccent = section.accent || '#1d4ed8';

                    const subBlocks = section.subcategories.map((sub, subIdx) => {
                        const filteredVideos = getFilteredVideos(sub, filterTerm, parentMatches);
                        if (filteredVideos.length === 0) return '';
                        const subAccent = sub.accent || groupAccent;
                        return `
                            <div class="relative scroll-mt-28" id="cat-${idx}-${subIdx}" style="${accentStyle(subAccent)}">
                                <div class="category-accent" style="width:32px; height:3px;"></div>
                                <h3 class="text-xl md:text-2xl font-extrabold mb-2" style="color:var(--accent-text);">${sub.category}</h3>
                                <p class="text-slate-500 font-medium text-base max-w-2xl category-description">${sub.description}</p>

                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-8">
                                    ${filteredVideos.map(videoCardHTML).join('')}
                                </div>
                            </div>
                        `;
                    }).join('');

                    if (subBlocks.trim().length > 0) {
                        hasResults = true;
                        sectionEl.style = accentStyle(groupAccent);
                        sectionEl.innerHTML = `
                            <div class="rounded-[2rem] p-6 md:p-12 border" style="background: linear-gradient(160deg, ${tint(groupAccent, 0.85)} 0%, ${tint(groupAccent, 0.94)} 100%); border-color: ${tint(groupAccent, 0.5)};">
                                <div class="mb-10 md:mb-14">
                                    <div class="category-accent" style="width:64px; height:6px;"></div>
                                    <h2 class="text-4xl md:text-5xl font-black text-slate-900">${section.category}</h2>
                                </div>
                                <div class="space-y-14 md:space-y-16 pr-6 md:pr-10 border-r-4" style="border-color: ${tint(groupAccent, 0.4)};">
                                    ${subBlocks}
                                </div>
                            </div>
                        `;
                        gallery.appendChild(sectionEl);
                    }

                } else {
                    // --- קטגוריה רגילה (ללא תתי-קטגוריות) ---
                    const filteredVideos = getFilteredVideos(section, filterTerm, false);
                    const accent = section.accent || '#1d4ed8';

                    if (filteredVideos.length > 0) {
                        hasResults = true;
                        sectionEl.style = accentStyle(accent);
                        sectionEl.innerHTML = `
                            <div class="rounded-[2rem] p-6 md:p-12 border" style="background: linear-gradient(160deg, ${tint(accent, 0.85)} 0%, ${tint(accent, 0.94)} 100%); border-color: ${tint(accent, 0.5)};">
                                <div class="category-accent"></div>
                                <h2 class="text-3xl font-black text-slate-900 mb-2">${section.category}</h2>
                                <p class="text-slate-500 font-medium text-lg max-w-2xl category-description">${section.description}</p>

                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-10">
                                    ${filteredVideos.map(videoCardHTML).join('')}
                                </div>
                            </div>
                        `;
                        gallery.appendChild(sectionEl);
                    }
                }
            });

            noResults.classList.toggle('hidden', hasResults);
        }

        // בונה את תפריט הניווט העליון (קטגוריות-על + תתי-קטגוריות בתפריט נשלף)
        function buildCategoryNav() {
            const nav = document.getElementById('category-nav');
            nav.innerHTML = DATA.map((section, idx) => {
                const sectionId = `cat-${idx}`;
                const accent = section.accent || '#1d4ed8';

                if (section.isGroup) {
                    const dropdownItems = section.subcategories.map((sub, subIdx) => {
                        const subAccent = sub.accent || accent;
                        return `
                        <a href="#cat-${idx}-${subIdx}" class="nav-dropdown-item" style="${accentStyle(subAccent)}" onclick="scrollToSection(event, 'cat-${idx}-${subIdx}')">
                            <span class="nav-dot" style="background:${subAccent};"></span>
                            ${sub.category}
                        </a>
                    `;
                    }).join('');

                    return `
                        <div class="nav-item" style="${accentStyle(accent)}">
                            <a href="#${sectionId}" class="nav-pill" onclick="scrollToSection(event, '${sectionId}')">
                                <span class="nav-dot" style="background:${accent};"></span>
                                ${section.category}
                                <svg class="nav-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                                </svg>
                            </a>
                            <div class="nav-dropdown">
                                ${dropdownItems}
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="nav-item" style="${accentStyle(accent)}">
                        <a href="#${sectionId}" class="nav-pill" onclick="scrollToSection(event, '${sectionId}')">
                            <span class="nav-dot" style="background:${accent};"></span>
                            ${section.category}
                        </a>
                    </div>
                `;
            }).join('');
        }

        // גלילה חלקה לקטגוריה/תת-קטגוריה, תוך איפוס החיפוש אם היה פעיל כדי שהיעד בטוח יהיה גלוי
        function scrollToSection(event, id) {
            event.preventDefault();

            const searchInput = document.getElementById('search-input');
            const needsReset = searchInput.value.trim().length > 0;

            if (needsReset) {
                searchInput.value = '';
                renderGallery('');
            }

            requestAnimationFrame(() => {
                const target = document.getElementById(id);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        }

        // פתיחה ישירה מותאמת לרזולוציה אנכית מלאה במובייל (ללא שוליים מיותרים)
        /* function watchVideo(driveId) {
            const videoUrl = `https://drive.google.com/file/d/${driveId}/view?usp=drivesdk`;
            window.location.href = videoUrl;
        }
        */

        function openModal(driveId,title,description){

    document.getElementById("video-title").innerText = title;
    document.getElementById("video-description").innerText = description;

    document.getElementById("video-frame").src =
        `https://drive.google.com/file/d/${driveId}/preview`;

    document.getElementById("video-modal").classList.remove("hidden");

    document.body.style.overflow="hidden";
}

function closeModal(){

    document.getElementById("video-frame").src="";

    document.getElementById("video-modal").classList.add("hidden");

    document.body.style.overflow="";
}

        window.onload = () => {
            renderGallery();
            buildCategoryNav();
        };
    </script>
